[package]
name = "pocketstation-relay"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Bounded WebRTC relay publishing connector for PocketStation"
keywords = ["audio", "realtime", "relay", "webrtc", "pocketstation"]
categories = ["multimedia::audio", "network-programming"]
include = ["/Cargo.toml", "/README.md", "/src/**", "/tests/**"]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []

[lints]
workspace = true

[dependencies]
base64 = "0.22"
pocketstation = { path = "../../pocketstation", version = "1.1.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
str0m = "0.20"
thiserror = "1"
tungstenite = { version = "0.29", features = ["native-tls"] }
url = "2"

[dev-dependencies]
pocketstation = { path = "../../pocketstation", version = "1.1.1", default-features = false, features = ["conformance-fixtures"] }
