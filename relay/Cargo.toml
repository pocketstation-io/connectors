[package]
name = "pocketstation-relay"
version = "0.1.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Publish and receive PocketStation AudioBuses over WebRTC"
keywords = ["audio", "realtime", "relay", "webrtc", "pocketstation"]
categories = ["multimedia::audio", "network-programming"]
include = [
  "/Cargo.toml",
  "/README.md",
  "/RELEASE_NOTES.md",
  "/src/**",
  "/tests/**",
]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []

[lints]
workspace = true

[dependencies]
native-tls = "=0.2.18"
base64 = "0.22"
pocketstation = { version = "1.1.10", default-features = false, features = ["opus-codec"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
str0m = "0.20"
thiserror = "1"
tungstenite = { version = "0.29", features = ["native-tls"] }
url = "2"

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs"] }
pocketstation = { version = "1.1.10", default-features = false, features = ["conformance-fixtures"] }
