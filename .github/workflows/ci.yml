name: connector-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  relay:
    name: Relay connector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Verify the packaged conformance vector
        run: |
          actual="$(
            openssl dgst -sha256 relay/tests/fixtures/connector-v1-vectors.json |
              awk '{print $NF}'
          )"
          test "${actual}" = "18d7218047bd77b599c0639b69c4fead31149beccbc13156fd387512bc818b91"

      - name: Public documentation language
        run: |
          if rg -n -i '\b(boundary|path|surface|authority|projection|lowering|flow|layer|contracts?)\b' \
            README.md relay \
            --glob '*.md' --glob '*.mdx'; then
            echo "Public documentation must name the API, queue, process, service, or request directly."
            exit 1
          fi

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

      - name: Verify the crates.io package
        run: cargo publish --manifest-path relay/Cargo.toml --dry-run --locked
