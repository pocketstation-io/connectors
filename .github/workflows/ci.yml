name: connector-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  relay:
    name: Relay connector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check out protocol conformance data
        uses: actions/checkout@v4
        with:
          repository: pocketstation-io/protocol
          path: protocol

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Verify the packaged conformance vector
        run: >-
          cmp
          relay/tests/fixtures/connector-v1-vectors.json
          protocol/conformance/connector/v1/vectors.json

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

      - name: Verify the crates.io package
        run: cargo publish --manifest-path relay/Cargo.toml --dry-run --locked
