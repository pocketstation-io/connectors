name: publish-relay-connector

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version-matched release tag to resume
        required: true
        type: string

permissions:
  contents: read

env:
  PKS_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
  PKS_RELEASE_EVENT: ${{ github.event_name }}
  PKS_RELEASE_CONTROLLER_REF: ${{ github.ref }}
  PKS_RELEASE_CONTROLLER_SHA: ${{ github.sha }}

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'release' &&
        github.event.release.prerelease == false &&
        startsWith(github.event.release.tag_name, 'pocketstation-relay-v')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt

      - name: Bind selected tag source and workflow controller
        run: bash scripts/publish-relay.sh --check-source

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Verify the package
        run: |
          actual="$(
            openssl dgst -sha256 relay/tests/fixtures/connector-v1-vectors.json |
              awk '{print $NF}'
          )"
          test "${actual}" = "18d7218047bd77b599c0639b69c4fead31149beccbc13156fd387512bc818b91"
          cargo fmt --all -- --check
          cargo test --workspace --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --all-features --locked
          bash scripts/publish-relay.sh --dry-run
          bash scripts/test-publish-relay-recovery.sh

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0

      - name: Bind selected tag source and workflow controller
        run: bash scripts/publish-relay.sh --check-source

      - name: Publish pocketstation-relay
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-relay.sh
